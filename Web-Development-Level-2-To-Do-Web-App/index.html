<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TaskFlow | To-Do App</title>

    <!-- Bootstrap -->
    <link
      rel="stylesheet"
      href="./node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <!-- =========================
         Main
    ========================== -->

    <main class="app-wrapper">
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-12 col-md-10 col-lg-8 col-xl-7">
            <!-- =========================
                 App Card
            ========================== -->

            <div class="app-card">
              <!-- Header -->

              <div class="app-header">
                <div>
                  <span class="app-label"> Productivity </span>

                  <h1>TaskFlow</h1>

                  <p>Organize your day, one task at a time.</p>
                </div>

                <div class="task-counter">
                  <span id="taskCount">0</span>
                  <small>Tasks</small>
                </div>
              </div>

              <!-- =========================
                   Add Task Form
              ========================== -->

              <form id="taskForm" class="task-form">
                <div class="input-group">
                  <input
                    type="text"
                    id="taskInput"
                    class="form-control"
                    placeholder="What do you need to do?"
                    autocomplete="off"
                  />

                  <button type="submit" class="btn btn-primary">
                    Add Task
                  </button>
                </div>

                <small id="errorMessage" class="error-message"> </small>
              </form>

              <!-- =========================
                   Filters
              ========================== -->

              <div class="filters">
                <button
                  type="button"
                  class="filter-btn active"
                  data-filter="all"
                >
                  All
                </button>

                <button type="button" class="filter-btn" data-filter="active">
                  Active
                </button>

                <button
                  type="button"
                  class="filter-btn"
                  data-filter="completed"
                >
                  Completed
                </button>
              </div>

              <!-- =========================
                   Task List
              ========================== -->

              <div id="taskList" class="task-list">
                <!-- Tasks will be added here by JavaScript -->
              </div>

              <!-- =========================
                   Empty State
              ========================== -->

              <div id="emptyState" class="empty-state">
                <div class="empty-icon">✓</div>

                <h2>No tasks yet</h2>

                <p>Add your first task and start being productive.</p>
              </div>

              <!-- =========================
                   Footer
              ========================== -->

              <div class="app-footer">
                <span> Stay focused. Stay productive. </span>

                <button
                  type="button"
                  id="clearCompleted"
                  class="clear-completed"
                >
                  Clear Completed
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap JS -->

    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->

    <script src="./script.js"></script>
  </body>
</html>
